<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>こどもケア | 運営管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#20382e;background:#f3f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:24px 16px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:25px;margin:0}h2{font-size:19px;margin:0 0 14px}.muted{color:#68796f;font-size:13px}.card{background:#fff;border:1px solid #e1eae4;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #243d2d0b}.btn{border:0;border-radius:11px;background:#128b65;color:#fff;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.btn.alt{background:#e8f3ed;color:#176b4e}.btn.outline{background:#fff;color:#23674d;border:1px solid #c8dfd1}.field{display:block;width:100%;border:1px solid #cbd9ce;border-radius:10px;padding:12px;margin:6px 0 13px;font:inherit;background:white}label{font-size:13px;font-weight:700}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hide{display:none!important}.error{color:#ae3b3b;white-space:pre-wrap}.pill{font-size:12px;border-radius:99px;background:#eaf3ec;padding:5px 9px;font-weight:700}.pill.open{background:#fff0dc;color:#8c5816}.pill.in_progress{background:#e5efff;color:#255b9c}.pill.closed{background:#e4f4e8;color:#257148}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border-radius:13px;background:#f1f7f2;text-align:center}.stat strong{display:block;font-size:23px}.ticket{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e1eae4;border-radius:13px;padding:15px;margin:9px 0;cursor:pointer;color:inherit;font:inherit}.ticket:hover{border-color:#78b89a}.ticket-title{font-weight:750;margin:8px 0}.message{border-radius:13px;padding:13px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f5f1}.message.admin{background:#e7f4ec}.message small{display:block;color:#65786d;margin-bottom:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar button{font-size:13px}.notice{padding:12px;background:#fff8e7;border-radius:10px;font-size:13px;color:#675728}.spinner{padding:20px;text-align:center;color:#637c6b}@media(max-width:560px){main{padding:18px 12px 60px}.card{padding:15px}h1{font-size:21px}}
</style></head><body><main>
<header><div><h1>🌿 こどもケア｜運営管理</h1><div class="muted">お問い合わせ専用ダッシュボード</div></div><button class="btn alt hide" id="logout">ログアウト</button></header>
<div id="alert" role="status" aria-live="polite"></div>
<section id="loginPanel" class="card hide"><h2>管理者ログイン</h2><p class="muted">こどもケアの管理者アカウントでログインしてください。</p><form id="loginForm"><label>メールアドレス<input class="field" type="email" name="email" autocomplete="username" required></label><label>パスワード<input class="field" type="password" name="password" autocomplete="current-password" required></label><button class="btn" type="submit">ログイン</button></form></section>
<section id="denied" class="card hide"><h2>アクセスできません</h2><p>このアカウントには運営管理の権限がありません。</p><button class="btn alt" id="deniedLogout">別のアカウントでログイン</button></section>
<section id="dashboard" class="hide"><div class="stats"><div class="stat"><strong id="countAll">0</strong><span class="muted">すべて</span></div><div class="stat"><strong id="countOpen">0</strong><span class="muted">未対応</span></div><div class="stat"><strong id="countClosed">0</strong><span class="muted">対応済み</span></div></div><div id="listPanel" class="card"><div class="row"><h2>お問い合わせ一覧</h2><button class="btn alt" id="refresh">更新</button></div><div class="toolbar" id="filters"><button class="btn" data-filter="all">すべて</button><button class="btn alt" data-filter="open">未対応</button><button class="btn alt" data-filter="in_progress">対応中</button><button class="btn alt" data-filter="closed">対応済み</button></div><div id="ticketList"></div><p class="muted">最新100件を表示しています。</p></div><div id="detailPanel" class="card hide"><button class="btn alt" id="back">← 一覧に戻る</button><h2 id="detailTitle" style="margin-top:20px"></h2><div id="detailMeta" class="muted"></div><div class="card" style="background:#f8faf8"><b>お問い合わせ内容</b><div id="detailBody" style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px"></div></div><label for="status">対応状況</label><div class="row"><select class="field" id="status" style="flex:1;margin-bottom:0"><option value="open">未対応</option><option value="in_progress">対応中</option><option value="closed">対応済み</option></select><button class="btn alt" id="saveStatus">状態を保存</button></div><h2 style="margin-top:25px">返信履歴</h2><div id="messageList"></div><form id="replyForm"><label for="replyText">返信を書く</label><textarea class="field" id="replyText" rows="5" maxlength="3000" required placeholder="ユーザーへの返信内容を入力"></textarea><button class="btn" type="submit">返信を送信</button></form><p class="notice">返信はデータベースに保存されます。ユーザー側の問い合わせ履歴画面は、これから実装します。現時点では相手に通知されません。</p></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);const cfg=window.CLOUD_CONFIG||{};let client=null,session=null,tickets=[],selected=null,filter='all',adminId=null;
const show=(id,on)=>$(id).classList.toggle('hide',!on);
const say=(message,error=false)=>{const a=$('alert');a.textContent=message;a.className=error?'card error':message?'card notice':'';};
const date=s=>s?new Date(s).toLocaleString('ja-JP'):'日時不明';
const statusName={open:'未対応',in_progress:'対応中',closed:'対応済み'};
const categoryName={bug:'不具合',question:'使い方',request:'機能要望',other:'その他'};
function clearViews(){show('loginPanel',false);show('denied',false);show('dashboard',false);show('logout',false);}
async function checkAccess(){clearViews();say('');if(!session){show('loginPanel',true);return;}show('logout',true);adminId=session.user.id;const {data,error}=await client.rpc('is_support_admin');if(error){say('管理者権限を確認できません: '+error.message,true);return;}if(data!==true){show('denied',true);return;}show('dashboard',true);await loadTickets();}
async function loadTickets(){say('');$('ticketList').innerHTML='<div class="spinner">読み込み中…</div>';const {data,error}=await client.from('support_tickets').select('id,user_id,category,subject,message,status,created_at,updated_at').order('created_at',{ascending:false}).limit(100);if(error){say('問い合わせを読み込めません: '+error.message,true);$('ticketList').textContent='';return;}tickets=data||[];renderList();}
function renderList(){const n=s=>tickets.filter(t=>t.status===s).length;$('countAll').textContent=tickets.length;$('countOpen').textContent=n('open');$('countClosed').textContent=n('closed');document.querySelectorAll('[data-filter]').forEach(b=>b.className='btn '+(b.dataset.filter===filter?'':'alt'));const root=$('ticketList');root.replaceChildren();const shown=tickets.filter(t=>filter==='all'||t.status===filter);if(!shown.length){root.textContent='該当する問い合わせはありません。';return;}for(const t of shown){const b=document.createElement('button');b.type='button';b.className='ticket';const r=document.createElement('div');r.className='row';const cat=document.createElement('span');cat.className='muted';cat.textContent=categoryName[t.category]||t.category;const status=document.createElement('span');status.className='pill '+t.status;status.textContent=statusName[t.status]||t.status;r.append(cat,status);const title=document.createElement('div');title.className='ticket-title';title.textContent=t.subject;const time=document.createElement('div');time.className='muted';time.textContent=date(t.created_at);b.append(r,title,time);b.addEventListener('click',()=>openTicket(t.id));root.append(b);}}
async function openTicket(id){selected=tickets.find(t=>t.id===id);if(!selected)return;show('listPanel',false);show('detailPanel',true);$('detailTitle').textContent=selected.subject;$('detailMeta').textContent=(categoryName[selected.category]||selected.category)+' ・ '+date(selected.created_at)+' ・ 問い合わせID: '+selected.id;$('detailBody').textContent=selected.message;$('status').value=selected.status;await loadMessages();}
async function loadMessages(){if(!selected)return;const ticketId=selected.id;const root=$('messageList');root.textContent='読み込み中…';const {data,error}=await client.from('support_messages').select('id,sender_id,message,created_at').eq('ticket_id',ticketId).order('created_at',{ascending:true});if(selected?.id!==ticketId)return;if(error){root.textContent='返信履歴を読み込めません: '+error.message;return;}root.replaceChildren();if(!data?.length){root.textContent='まだ返信はありません。';return;}for(const m of data){const div=document.createElement('div');const isAdmin=m.sender_id===adminId;div.className='message'+(isAdmin?' admin':'');const label=document.createElement('small');label.textContent=(isAdmin?'運営者':'ユーザー')+' ・ '+date(m.created_at);const body=document.createElement('div');body.textContent=m.message;div.append(label,body);root.append(div);}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;const button=e.target.querySelector('button');button.disabled=true;const f=new FormData(e.target);const {data,error}=await client.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});button.disabled=false;if(error){say('ログインできません: '+error.message,true);return;}session=data.session;e.target.reset();await checkAccess();});
async function logout(){if(client)await client.auth.signOut();session=null;adminId=null;selected=null;clearViews();show('loginPanel',true);say('ログアウトしました。');}
$('logout').addEventListener('click',logout);$('deniedLogout').addEventListener('click',logout);$('refresh').addEventListener('click',loadTickets);$('back').addEventListener('click',()=>{selected=null;show('detailPanel',false);show('listPanel',true);loadTickets();});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;renderList();}));
$('saveStatus').addEventListener('click',async()=>{if(!selected)return;const button=$('saveStatus');button.disabled=true;const next=$('status').value;const {error}=await client.from('support_tickets').update({status:next,updated_at:new Date().toISOString()}).eq('id',selected.id);button.disabled=false;if(error){say('状態を保存できません: '+error.message,true);return;}selected.status=next;say('対応状況を保存しました。');});
$('replyForm').addEventListener('submit',async e=>{e.preventDefault();if(!selected||!session)return;const msg=$('replyText').value.trim();if(!msg)return;const button=e.target.querySelector('button');button.disabled=true;const {error}=await client.from('support_messages').insert({ticket_id:selected.id,sender_id:session.user.id,message:msg});button.disabled=false;if(error){say('返信を保存できません: '+error.message,true);return;}$('replyText').value='';say('返信を保存しました（ユーザーへの通知はまだありません）。');await loadMessages();});
(async()=>{if(!cfg.url||!cfg.anonKey||!window.supabase){say('config.js またはSupabaseの設定を読み込めません。index.htmlと同じフォルダにadmin.htmlを置いてください。',true);return;}client=window.supabase.createClient(cfg.url,cfg.anonKey);const {data,error}=await client.auth.getSession();if(error){say('ログイン状態を確認できません: '+error.message,true);return;}session=data.session;await checkAccess();client.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'){session=null;adminId=null;selected=null;clearViews();show('loginPanel',true);}});})();
</script></body></html>
