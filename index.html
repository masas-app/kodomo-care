function showAppSettings(){let p=getAppPrefs();let checks=[[7,'7日前'],[3,'3日前'],[1,'前日'],[0,'当日']].map(([d,label])=>`<label style="display:flex;align-items:center;gap:9px;font-size:15px;padding:8px 0"><input type="checkbox" name="reminderDay" value="${d}" ${p.reminderDaysSelected.includes(d)?'checked':''} onchange="saveAppPreferences()">${label}</label>`).join('');let hours=Array.from({length:24},(_,i)=>`<option value="${i}" ${p.reminderHour===i?'selected':''}>${String(i).padStart(2,'0')}時</option>`).join('');let minutes=Array.from({length:60},(_,i)=>`<option value="${i}" ${p.reminderMinute===i?'selected':''}>${String(i).padStart(2,'0')}分</option>`).join('');modal('アプリの設定',`<p class="small">この設定は現在お使いの端末に保存されます。</p><label for="appFontSize">文字サイズ</label><select class="field" id="appFontSize" onchange="saveAppPreferences()"><option value="small" ${p.fontSize==='small'?'selected':''}>小さめ</option><option value="normal" ${p.fontSize==='normal'?'selected':''}>標準</option><option value="large" ${p.fontSize==='large'?'selected':''}>大きめ</option></select><hr><b>💉 予防接種のリマインダー</b><p class="small">通知日を複数選択できます。</p>${checks}<label>通知時刻</label><div style="display:flex;gap:10px"><select class="field" id="appReminderHour" aria-label="通知する時" onchange="saveAppPreferences()">${hours}</select><select class="field" id="appReminderMinute" aria-label="通知する分" onchange="saveAppPreferences()">${minutes}</select></div><div class="note">指定した日・時刻を過ぎてアプリを開くと、ホームにお知らせを表示します。アプリを閉じている間のプッシュ通知はまだ未実装です。</div><hr><b>🔔 スマホへのプッシュ通知</b><p class="small">ホーム画面に追加したアプリから通知を許可できます。許可後も、自動配信にはサーバー側の設定が必要です。</p><p id="pushPermissionStatus" class="small" role="status">通知の状態を確認中…</p><button class="btn alt" id="pushEnableButton" type="button" onclick="enablePushPermission()">通知を許可する</button> <button class="btn alt" id="pushTestButton" type="button" onclick="testPushNotification()" style="display:none">テスト通知を送る</button><hr><button class="action" onclick="showFamily()">👪 家族共有・バックアップ <span>›</span></button><button class="action" onclick="showSupportInfo()">✉ お問い合わせ・サポート <span>›</span></button><button class="action" onclick="showPrivacyInfo()">🔒 プライバシーについて <span>›</span></button>`);refreshPushPermissionStatus()}
function refreshPushPermissionStatus(){

async function submitSupportTicket(e){
  e.preventDefault();
  if(!client||!session)return alert('ログインしてから送信してください');

async function enablePushPermission(){
  const status=document.getElementById('pushPermissionStatus');
  const report=(message)=>{if(status)status.textContent=message;};
  if(!window.isSecureContext){report('HTTPS接続が必要です。');return;}
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    report('この環境はWebプッシュ通知に対応していません。iPhoneではSafariからホーム画面に追加したアプリで開いてください。');return;
  }
  const installed=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(!installed&&/iPhone|iPad|iPod/.test(navigator.userAgent)){
    report('iPhoneではSafariの共有メニューからホーム画面に追加し、追加したアイコンから起動してください。');return;
  }
  try{
    const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    await navigator.serviceWorker.ready;
    const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
    if(permission==='granted'){
      refreshPushPermissionStatus();
    }else if(permission==='denied'){
      report('通知が拒否されています。iPhoneの設定から、このアプリの通知を許可してください。');
    }else{
      report('通知の許可が保留されました。もう一度操作するか、端末の設定を確認してください。');
    }
  }catch(err){report('通知の準備に失敗しました：'+(err.message||String(err)));}
}

function openLogin(){if(!cfg.url||!cfg.anonKey)return modal('クラウド設定が必要',`<p>まず同梱の <b>SETUP.md</b> に従ってSupabaseを設定し、<b>config.js</b> にURLと公開用キーを入力してください。</p><p class="note">秘密鍵・service_roleキーは絶対にアプリに入れないでください。</p>`);modal('家族共有にログイン',`<form onsubmit="login(event)"><label>メールアドレス</label><input class="field" type="email" name="email" required><label>パスワード（8文字以上）</label><input class="field" type="password" name="password" minlength="8" required><button class="btn" name="action" value="signin">ログイン</button> <button class="btn alt" name="action" value="signup">新規登録</button></form><p class="small">メール認証を有効にしている場合は、登録後に届く確認メールを開いてください。</p><p id="loginError" class="error"></p>`)}async function login(e){e.preventDefault();let f=new FormData(e.target),action=e.submitter?.value||'signin',args={email:f.get('email'),password:f.get('password')};let res=action==='signup'?await client.auth.signUp(args):await client.auth.signInWithPassword(args);if(res.error)return $('#loginError').textContent=res.error.message;if(action==='signup'&&!res.data.session)return $('#loginError').textContent='確認メールを開いてからログインしてください。';session=res.data.session;await initCloud();closeModal();render()}

async function initCloud(){

 if(!session)return;

 let {data:members,error}=await client.from('family_members').select('family_id,role').eq('user_id',session.user.id).limit(1);

 if(error){alert('クラウド接続エラー: '+error.message);return}

 if(cloudChannel){await client.removeChannel(cloudChannel);cloudChannel=null}

 if(!members?.length){mode='local';data.family_id=null;cloudVersion=null;render();return}

 data.family_id=members[0].family_id;mode='cloud';await fetchCloud();

 cloudChannel=client.channel('family-'+data.family_id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'family_data',filter:'family_id=eq.'+data.family_id},()=>fetchCloud()).subscribe();render();

}

async function fetchCloud(){

 if(!data.family_id)return;

 let {data:rows,error}=await client.from('family_data').select('payload,version').eq('family_id',data.family_id).limit(1);

 if(error){alert('クラウドの読み込みに失敗: '+error.message);return}

 if(!rows?.length)return;

 let p=rows[0].payload||blank(),family=data.family_id;

 cloudVersion=rows[0].version;

 data={...blank(),...p,family_id:family};loadPhotos();render();

}

async function saveAll(){

 if(mode==='local'){persist();return true}

 if(!session||!data.family_id||cloudVersion===null){alert('クラウドに接続できていません');return false}

 let payload={children:data.children.map(({photo,...c})=>c),records:data.records};

 let {data:newVersion,error}=await client.rpc('update_family_data',{p_family_id:data.family_id,p_payload:payload,p_expected_version:cloudVersion});

 if(error){alert('保存できませんでした。最新データを読み込みます。変更内容は失われる可能性があります。\n'+error.message);await fetchCloud();return false}

 cloudVersion=newVersion;return true;

}

async function createMyFamily(){

 if(!session)return openLogin();

 if(!confirm('新しい家族を作成しますか？ すでに別の家族から招待されている場合は「キャンセル」を押してください。'))return;

 let localCopy=JSON.parse(localStorage.getItem('kodomo-v09')||'{}');

 let {error}=await client.rpc('create_family');if(error)return alert('家族作成に失敗: '+error.message);

 await initCloud();

 if(localCopy.children?.length&&confirm('この端末の既存の記録をクラウドに移しますか？')){

   data.children=localCopy.children.map(({photo,...c})=>({...c,photo:''}));data.records=localCopy.records||[];

   await saveAll();

 }

 closeModal();render();

}

async function makeInvite(){let {data:code,error}=await client.rpc('create_invite');if(error)return alert(error.message);modal('家族の招待コード',`<p>家族のスマホでログインし、「招待コードで家族に参加」から入力してください。</p><p style="overflow-wrap:anywhere;font-weight:bold;color:#168f69">${escapeHtml(code)}</p><button class="btn" onclick="navigator.clipboard?.writeText('${code}')">コードをコピー</button><p class="note">コードは24時間で期限切れになります。信頼できる家族にだけ共有してください。</p>`)}

function joinPrompt(){modal('家族に参加',`<p class="note">招待コードを入力して家族の記録を共有します。</p><form onsubmit="joinFamily(event)"><label>招待コード</label><input class="field" name="code" required maxlength="32" autocomplete="off"><button class="btn">参加する</button></form><p id="joinError" class="error"></p>`)}

async function joinFamily(e){e.preventDefault();let code=new FormData(e.target).get('code').trim();let {error}=await client.rpc('join_family',{invite_code:code});if(error)return $('#joinError').textContent=error.message;await initCloud();closeModal();render()}

async function signOut(){if(cloudChannel){await client.removeChannel(cloudChannel);cloudChannel=null}let {error}=await client.auth.signOut();if(error){alert('ログアウトできませんでした: '+error.message);return}session=null;mode='local';cloudVersion=null;data=blank();current='home';closeModal();render()}

async function boot(){if(cfg.url&&cfg.anonKey){data=blank()}else{loadPhotos()}render();if(cfg.url&&cfg.anonKey&&window.supabase){client=window.supabase.createClient(cfg.url,cfg.anonKey);let {data:auth}=await client.auth.getSession();if(auth.session){session=auth.session;await initCloud()}client.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'){session=null;mode='local';cloudVersion=null;data=blank();current='home';closeModal();render()}})}}boot();

</script></body></html>
