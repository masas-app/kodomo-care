function refreshPushPermissionStatus(){
  const status=document.getElementById('pushPermissionStatus');
  const enable=document.getElementById('pushEnableButton');
  const test=document.getElementById('pushTestButton');
  if(!status)return;
  const supported='serviceWorker' in navigator && 'Notification' in window;
  const granted=supported && Notification.permission==='granted';
  const denied=supported && Notification.permission==='denied';
  if(test)test.style.display='inline-block';
  if(enable){enable.style.display=granted?'none':'inline-block';enable.textContent=denied?'iPhoneの設定で通知を許可':'通知を許可する';}
  status.textContent=!supported?'この環境は通知に対応していません。':granted?'✅ 通知は許可されています。テスト通知を試せます。':denied?'通知が拒否されています。iPhoneの設定で「こどもケア」の通知をオンにしてください。':'通知はまだ許可されていません。';
}

async function testPushNotification(){
  const status=document.getElementById('pushPermissionStatus');
  if(!('Notification' in window)){if(status)status.textContent='この環境ではNotification APIが利用できません。ホーム画面から起動してください。';return;}
  if(!('serviceWorker' in navigator)){if(status)status.textContent='Service Workerに対応していません。';return;}
  if(Notification.permission!=='granted'){
    if(status)status.textContent='通知の許可状態：'+Notification.permission+'。iPhone設定で許可済みでも、Safariとホーム画面アプリは別扱いです。ホーム画面のこどもケアから操作してください。';
    return;
  }
  try{
    const registration=await navigator.serviceWorker.register('./sw.js?v=2026.10.26.1',{scope:'./',updateViaCache:'none'});
    await registration.showNotification('こどもケア・テスト通知',{body:'通知の受信テストに成功しました！',tag:'kodomo-care-test-'+Date.now(),data:{url:'./'}});
    if(status)status.textContent='テスト通知を送信しました。ロック画面や通知センターで確認してください。';
  }catch(err){if(status)status.textContent='テスト通知に失敗しました：'+(err.message||String(err));}
}

function pushReport(message){const el=document.getElementById('serverPushStatus');if(el)el.textContent=message;}
function vapidToBytes(value){const base64=value.trim().replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64+'='.repeat((4-base64.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0));}
async function registerServerPush(){
  try{
    if(!client||!session)throw Error('家族共有にログインしてください。');
    if(!('PushManager' in window)||!('serviceWorker' in navigator))throw Error('ホーム画面に追加したアプリで開いてください。');
    const key=document.getElementById('pushPublicKey')?.value.trim()||'';
    if(!key)throw Error('VAPID Public Keyを入力してください。');
    const bytes=vapidToBytes(key);
    if(bytes.length!==65)throw Error('公開鍵の形式が違います。Public Keyを確認してください。');
    localStorage.setItem('kodomo-care-vapid-public',key);
    if(Notification.permission!=='granted'){
      const permission=await Notification.requestPermission();
      if(permission!=='granted')throw Error('通知の許可が必要です。');
    }
    pushReport('通知先を登録中…');
    const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    const existing=await reg.pushManager.getSubscription();
    let subscription=existing;
    if(existing){
      const currentKey=existing.options?.applicationServerKey;
      if(currentKey && Array.from(new Uint8Array(currentKey)).join(',')!==Array.from(bytes).join(',')){
        await existing.unsubscribe();subscription=null;
      }
    }
    if(!subscription)subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});
    const {data,error}=await client.functions.invoke('send-push',{body:{action:'subscribe',subscription:subscription.toJSON()}});
    if(error)throw error;
    if(!data?.success)throw Error(data?.error||'サーバーへの登録に失敗しました。');
    await syncReminderPrefs();
    pushReport('✅ このiPhoneを通知先に登録しました。次に「サーバーからテスト送信」を押してください。');
  }catch(err){pushReport('登録エラー：'+(err.message||String(err)));}
}

async function syncReminderPrefs(){
  if(!client||!session)return;
  const p=getAppPrefs();
  const {error}=await client.from('reminder_preferences').upsert({
    user_id:session.user.id,
    reminder_days:p.reminderDaysSelected,
    reminder_hour:p.reminderHour,
    reminder_minute:p.reminderMinute,
    timezone:'Asia/Tokyo',
    updated_at:new Date().toISOString()
  },{onConflict:'user_id'});
  if(error){
    const el=document.getElementById('serverPushStatus');
    if(el)el.textContent='通知設定のクラウド同期に失敗：'+error.message;
    throw error;
  }
}
async function loadReminderPrefs(){
  if(!client||!session)return;
  const {data:remote,error}=await client.from('reminder_preferences')
    .select('reminder_days,reminder_hour,reminder_minute')
    .eq('user_id',session.user.id).maybeSingle();
  if(error){console.warn('通知設定の読み込みに失敗',error.message);return;}
  if(remote){
    const p=getAppPrefs();
    const days=Array.isArray(remote.reminder_days)?remote.reminder_days.map(Number).filter(n=>[0,1,3,7].includes(n)):p.reminderDaysSelected;

    applyAppPrefs();
  }else{
    await syncReminderPrefs().catch(err=>console.warn(err));
  }
}

async function enablePushPermission(){
  const status=document.getElementById('pushPermissionStatus');
  const report=(message)=>{if(status)status.textContent=message;};
  if(!window.isSecureContext){report('HTTPS接続が必要です。');return;}
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    report('この環境はWebプッシュ通知に対応していません。iPhoneではSafariからホーム画面に追加したアプリで開いてください。');return;
  }
  const installed=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(!installed&&/iPhone|iPad|iPod/.test(navigator.userAgent)){
    report('iPhoneではSafariの共有メニューからホーム画面に追加し、追加したアイコンから起動してください。');return;
  }
  try{
    const registration=await navigator.serviceWorker.register('./sw.js?v=2026.10.26.1',{scope:'./',updateViaCache:'none'});
    await navigator.serviceWorker.ready;
    const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
    if(permission==='granted'){
      refreshPushPermissionStatus();
    }else if(permission==='denied'){
      report('通知が拒否されています。iPhoneの設定から、このアプリの通知を許可してください。');
    }else{
      report('通知の許可が保留されました。もう一度操作するか、端末の設定を確認してください。');
    }
  }catch(err){report('通知の準備に失敗しました：'+(err.message||String(err)));}
}

let careSection='welcome';
let careHistory=[{section:'welcome',child:'home'}],careHistoryIndex=0;
function carePushHistory(){
  const state={section:careSection,child:current};
  const previous=careHistory[careHistoryIndex];
  if(previous&&previous.section===state.section&&previous.child===state.child)return;
  careHistory=careHistory.slice(0,careHistoryIndex+1);
  careHistory.push(state);
  careHistoryIndex=careHistory.length-1;
}
function careUpdateArrows(){
  const back=document.getElementById('careBack'),forward=document.getElementById('careForward');
  if(back)back.disabled=careHistoryIndex===0;
  if(forward)forward.disabled=careHistoryIndex>=careHistory.length-1;
}
function careNavigate(direction){
  // A shortcut may open a dialog: dismiss it before navigating.
  closeModal();
  const target=careHistoryIndex+direction;
  if(target<0||target>=careHistory.length)return;
  careHistoryIndex=target;
  careSection=careHistory[target].section;
  current=careHistory[target].child;
  closeSideMenu();
  render();
  window.scrollTo(0,0);
}
function goCareSection(section){
  careSection=section;
  current='home';
  closeModal();
  closeSideMenu();
  carePushHistory();
  render();
  window.scrollTo(0,0);
}
function render(){
  $('#switchBtn').style.display=careSection==='postpartum'&&current!=='home'?'':'none';
  careUpdateArrows();
  // Keep the original login and all postpartum functions intact.
  if(cfg.url&&cfg.anonKey&&!session){renderPostpartum();return;}

}

function careSetDueDate(value){
  // Update the displayed count immediately, without rebuilding the date input.
  // iOS can show a selected date before the input's change/blur event fires.
  const el=document.getElementById('careCountdown');
  if(!value){
    localStorage.removeItem('care-prenatal-due');
    if(el)el.textContent='予定日を登録';
    return;
  }
  const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if(!match)return;
  const y=Number(match[1]),m=Number(match[2]),d=Number(match[3]);
  const target=new Date(y,m-1,d);
  if(target.getFullYear()!==y||target.getMonth()!==m-1||target.getDate()!==d)return;
  localStorage.setItem('care-prenatal-due',value);
  const now=new Date();
  const days=Math.round((Date.UTC(y,m-1,d)-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  if(el)el.textContent=days>=0?'あと '+days+' 日':'予定日から '+Math.abs(days)+' 日';
}
function careSetPrenatalTask(id,checked){
  const tasks=JSON.parse(localStorage.getItem('care-prenatal-tasks')||'{}');
  tasks[id]=checked;
  localStorage.setItem('care-prenatal-tasks',JSON.stringify(tasks));
}

const careProcedureLegacyLocations = { kochi: '392014', sakawa: '394025' };
const careProcedureBirthKey = 'care-procedure-birth';
const careProcedureDateFormat = new Intl.DateTimeFormat('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short', timeZone:'UTC' });

function careProcedureDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
  const date = new Date(value + 'T00:00:00Z');
  return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value ? date : null;
}

function careProcedureToday() {
  return new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
}

function careProcedureBirth() {
  const value = localStorage.getItem(careProcedureBirthKey) || '';
  return value <= careProcedureToday() && careProcedureDate(value) ? value : '';
}

function careProcedureSelection() {
  const storedCode = localStorage.getItem(careProcedureLocationKey) || '';
  const municipality = Object.hasOwn(careProcedureLegacyLocations, storedCode)
    ? careProcedureLegacyLocations[storedCode]
    : storedCode;
  const codePrefix = municipality.slice(0, 2);
  if (careProcedureDirectory[codePrefix]?.municipalities[municipality]) {
    return { prefecture: codePrefix, municipality };
  }
  const prefecture = localStorage.getItem(careProcedurePrefectureKey);
  return {
    prefecture: Object.hasOwn(careProcedureDirectory, prefecture) ? prefecture : '',
    municipality: '',
  };
}

function careProcedureMunicipalityOptions(prefecture, selected) {
  const area = careProcedureDirectory[prefecture];
  const placeholder = area ? '市区町村を選ぶ' : '先に都道府県を選ぶ';
  const options = Object.entries(area?.municipalities || {}).map(([code, name]) =>
    `<option value="${code}" ${code === selected ? 'selected' : ''}>${escapeHtml(name)}</option>`
  );
  return `<option value="">${placeholder}</option>${options.join('')}`;
}

function careSetProcedurePrefecture(prefecture) {
  const exists = Object.hasOwn(careProcedureDirectory, prefecture);
  if (exists) localStorage.setItem(careProcedurePrefectureKey, prefecture);
  else localStorage.removeItem(careProcedurePrefectureKey);
  localStorage.removeItem(careProcedureLocationKey);

  const select = $('#careProcedureMunicipality');
  select.innerHTML = careProcedureMunicipalityOptions(prefecture, '');
  select.disabled = !exists;
  renderCareProcedureResults();
}

function careSetProcedureMunicipality(code) {
  const prefecture = $('#careProcedurePrefecture').value;
  const area = careProcedureDirectory[prefecture];
  if (area) localStorage.setItem(careProcedurePrefectureKey, prefecture);
  if (area?.municipalities[code]) localStorage.setItem(careProcedureLocationKey, code);
  else localStorage.removeItem(careProcedureLocationKey);
  renderCareProcedureResults();
}

function careSetProcedureBirth(input) {
  if (input.validity.badInput) return;
  const value = input.value;
  const invalid = value && (!careProcedureDate(value) || value > careProcedureToday());
  input.setAttribute('aria-invalid', invalid ? 'true' : 'false');
  $('#careProcedureBirthError').textContent = invalid ? '出生日は今日以前の日付で入力してください。' : '';
  if (invalid) return;
  if (value) localStorage.setItem(careProcedureBirthKey, value);
  else localStorage.removeItem(careProcedureBirthKey);
  renderCareProcedureResults();
}

        <label>出産予定日
          <input id="careProcedureDue" type="date" value="${careProcedureDate(due) ? due : ''}"

function renderCareProcedureResults() {
  const prefecture = $('#careProcedurePrefecture').value;
  const code = $('#careProcedureMunicipality').value;
  const results = $('#careProcedureResults');
  const area = careProcedureDirectory[prefecture];
  const name = area?.municipalities[code];
  if (!name) {
    const message = area ? '市区町村を選んでください' : '都道府県から選んでください';
    results.innerHTML = `<div class="care-section"><h2>${message}</h2><p class="care-muted">全国の市区町村から選べます。</p></div>`;
    return;
  }

  const municipality = careProcedureLocalGuides[code];
  const parent = careProcedureMunicipalitySourceParents[code];
  const municipalitySources = careProcedureMunicipalitySources[parent || code];
  const prefectureSources = municipalitySources && careProcedurePrefectureSources[prefecture];
  const regionalGuide = careProcedureRegionalPrograms[code] || municipalitySources;
  const stages = regionalGuide ? [
    ...careProcedureStages,
    {
      id: 'careProcedureRegionalSupport',
      title: '地域の子育て支援',
      rules: [...regionalGuide.cards, ...(prefectureSources?.cards || [])].map((program, index) =>
        ({ id: `regional-${code}-${index}`, program })),
      contact: prefectureSources,
      overview: regionalGuide.overview,
    },
  ] : careProcedureStages;
  const areaName = municipality || municipalitySources ? name : `${area.name} ${name}`;
  const scope = municipality ? '自治体別の案内'
    : municipalitySources ? '共通手続きと自治体の公式案内' : '全国共通の案内';
  const birth = careProcedureBirth();
  const due = localStorage.getItem('care-prenatal-due') || '';
  const date = careProcedureDate(birth || due);
  const note = birth
    ? '実際の出生日から目安を表示しています。'
    : date
      ? '予定日に生まれた場合の仮の日付です。出産後は実際の出生日で計算し直してください。'
      : '出産予定日を登録すると、出生届と児童手当の日付の目安が表示されます。';

  const openCards = new Set(Array.from(results.querySelectorAll('details[open]'), details => details.dataset.procedure));
  results.innerHTML = `<div class="care-procedure-summary">
      <p role="status"><b>${escapeHtml(areaName)}の手続き</b><br>
        <span class="care-procedure-scope">${scope}</span><br>
        ${note}
      </p>
      ${municipalitySources ? '<p>手続きカードや地域の案内から、自治体の申請先や必要書類を確認できます。</p>' :
        municipality ? '' : `<p>この地域の自治体別ガイドは準備中です。窓口・必要書類・独自の制度は、自治体の公式サイトで確認できます。</p>
      <a href="https://www.j-lis.go.jp/spd/map-search/cms_1069.html" target="_blank" rel="noopener noreferrer">自治体の公式サイトを探す ↗</a>`}
      ${regionalGuide ? '<a href="#careProcedureRegionalSupport">地域の子育て支援を見る</a>' : ''}
      ${municipalitySources ? '<p class="care-muted">掲載しているのは公式情報で確認できた制度です。ほかの支援も自治体の子育て案内で確認できます。</p>' : ''}
    </div>
    ${stages.map(stage => `<section class="care-procedure-stage"${stage.id ? ` id="${stage.id}"` : ''}>
      <h2>${stage.title}</h2>
      ${stage.overview ? `<p class="care-muted">子育て支援の内容は自治体の案内で確認できます。</p>
      <a href="${escapeHtml(stage.overview.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(stage.overview.title)} ↗</a>` : ''}
      ${stage.contact && stage.contact.url !== stage.overview?.url
        ? `<div><a href="${escapeHtml(stage.contact.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(stage.contact.title)} ↗</a></div>` : ''}
      ${stage.rules.map(rule => {
        const localGuide = rule.program || municipality?.[rule.id];
        const item = localGuide || careProcedureCommon[rule.id];
        const localUrl = municipalitySources?.links?.[rule.id];
        if (!item) return '';
        let dateMarkup = '';
        if (date && rule.offset !== undefined) {
          const target = new Date(date.getTime());
          target.setUTCDate(target.getUTCDate() + rule.offset);
          dateMarkup = `<div class="care-procedure-date">
            <span>${birth ? '出生日からの目安' : '予定日からの仮の目安'}</span>
            <time datetime="${target.toISOString().split('T')[0]}">${careProcedureDateFormat.format(target)}</time>
          </div>`;
        }
        return `<article class="care-procedure-card">
          <h3>${item.title || rule.title}</h3>
          <p>${item.timing || rule.timing}</p>
          ${item.summary ? `<p>${escapeHtml(item.summary)}</p>` : ''}
          ${item.checkedOn ? `<p class="care-muted care-procedure-checked">公式情報の確認：<time datetime="${escapeHtml(item.checkedOn)}">${escapeHtml(item.checkedOn.replaceAll('-', '/'))}</time></p>` : ''}
          ${dateMarkup}
          <details data-procedure="${rule.id}" ${openCards.has(rule.id) ? 'open' : ''}>
            <summary>持ち物・申請先を見る</summary>
            <dl>
              <dt>申請先</dt><dd>${item.office}</dd>
              <dt>${localGuide && !item.documentsAreTypical ? '持ち物' : '持ち物の目安'}</dt><dd><ul>${item.documents.map(document => `<li>${document}</li>`).join('')}</ul></dd>
            </dl>
            ${item.note ? `<p class="care-muted">${item.note}</p>` : ''}
            ${localUrl ? `<div><a href="${escapeHtml(localUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(parent ? careProcedureDirectory[prefecture].municipalities[parent] : name)}の手続き案内 ↗</a></div>` : ''}
            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${item.linkLabel || (localGuide ? escapeHtml(name) + 'の公式案内' : '制度の公式案内')} ↗</a>
            ${item.additionalSource ? `<div><a href="${escapeHtml(item.additionalSource.url)}" target="_blank" rel="noopener noreferrer">${item.additionalSource.title} ↗</a></div>` : ''}
          </details>
        </article>`;
      }).join('')}
    </section>`).join('')}
    <p class="care-muted">表示の日付は暦上の目安です。窓口の受付日や個別の必要書類は、申請先の公式案内で確認してください。</p>`;
}

async function addChild(e){e.preventDefault();let f=new FormData(e.target),c={id:uuid(),name:f.get('name').trim(),dob:f.get('dob'),allergy:'',photo:''};if(!c.name)return;data.children.push(c);if(!await saveAll())return;current=c.id;closeModal();carePushHistory();render()}

function showRecords(){modal('予防接種の記録',`<button class="btn" onclick="editRecord()">＋ ワクチンを登録</button>${records().map(r=>`<div class="item row"><div><b>${escapeHtml(r.vaccine)}</b><div class="small">${escapeHtml(childName(r.child_id))} ・ ${labelStatus(r.status)} ・ ${displayRecordDate(r)}</div></div><button class="btn alt" onclick="editRecord('${r.id}')">編集</button></div>`).join('')||'<div class="empty">まだ登録がありません</div>'}`)}function labelStatus(s){return ({done:'接種済み',reserved:'予約済み',pending:'未予約'})[s]||s}function showStatus(s){modal(labelStatus(s),`${records().filter(r=>r.status===s).map(r=>`<div class="item"><b>${escapeHtml(r.vaccine)}</b><div class="small">${displayRecordDate(r)} ・ ${escapeHtml(r.clinic||'')}</div><div class="row"><button class="btn alt" onclick="editRecord('${r.id}')">編集</button>${s==='reserved'?`<button class="btn" onclick="markDone('${r.id}')">接種済みにする</button>`:''}</div></div>`).join('')||'<div class="empty">登録なし</div>'}<button class="btn alt" onclick="editRecord()">＋ 追加</button>`)}function editRecord(id){let r=data.records.find(r=>r.id===id)||{child_id:current==='home'?data.children[0]?.id:current,status:'pending',vaccine:'',date:'',appointment_time:'',clinic:'',memo:''};if(!data.children.length)return showChildren();modal(id?'記録を編集':'予防接種を登録',`<form onsubmit="saveRecord(event,'${id||''}')"><label>お子様</label><select class="field" name="child_id">${data.children.map(c=>`<option value="${c.id}" ${c.id===r.child_id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select><label>ワクチン名</label><input class="field" name="vaccine" value="${escapeHtml(r.vaccine)}" required maxlength="120"><label>状態</label><select class="field" name="status"><option value="pending" ${r.status==='pending'?'selected':''}>未予約</option><option value="reserved" ${r.status==='reserved'?'selected':''}>予約済み</option><option value="done" ${r.status==='done'?'selected':''}>接種済み</option></select><label>日付（未予約なら任意）</label><input class="field" type="date" name="date" value="${escapeHtml(r.date)}"><label>予約時刻（任意・未入力でも保存できます）</label><input class="field" type="time" name="appointment_time" value="${escapeHtml(r.appointment_time||'')}"><label>病院名</label><input class="field" name="clinic" value="${escapeHtml(r.clinic)}" maxlength="120"><label>メモ</label><textarea class="field" name="memo">${escapeHtml(r.memo)}</textarea><button class="btn">保存</button>${id?` <button type="button" class="btn warn" onclick="deleteRecord('${id}')">削除</button>`:''}</form>`)}async function saveRecord(e,id){e.preventDefault();let f=new FormData(e.target),r={id:id||uuid(),child_id:f.get('child_id'),vaccine:f.get('vaccine').trim(),status:f.get('status'),date:f.get('date'),appointment_time:f.get('appointment_time')||'',clinic:f.get('clinic'),memo:f.get('memo')};if(r.status==='reserved'&&!r.date)return alert('予約済みには接種予定日を入力してください');if(r.status==='done'&&!r.date)return alert('接種済みには実際の接種日を入力してください');data.records=id?data.records.map(x=>x.id===id?r:x):[...data.records,r];if(!await saveAll())return;closeModal();render()}async function deleteRecord(id){if(!confirm('削除しますか？'))return;data.records=data.records.filter(r=>r.id!==id);if(!await saveAll())return;closeModal();render()}async function markDone(id){let r=data.records.find(r=>r.id===id);if(!r)return;if(!confirm('接種済みに変更しますか？ 実際の接種日が予約日と異なる場合は編集してください。'))return;r.status='done';if(!await saveAll())return;closeModal();render()}

function showAllergy(){let c=child();if(!c)return;modal('アレルギー情報',`<div class="note">検査で陽性でも、臨床的なアレルギーと同じ意味ではありません。診断・指示は医師に確認してください。</div><form onsubmit="saveAllergy(event)"><label>医師の診断、疑い、症状、対応など</label><textarea class="field" name="allergy" rows="7">${escapeHtml(c.allergy||'')}</textarea><button class="btn">保存</button></form>`)}async function saveAllergy(e){e.preventDefault();child().allergy=new FormData(e.target).get('allergy');if(!await saveAll())return;closeModal();render()}

function showSettings(){let c=child();if(!c)return;modal('設定 ・ '+escapeHtml(c.name),`<p class="small">写真はこの端末にのみ保存します。クラウド共有の対象にはしません。</p><label>背景写真を選ぶ</label><input class="field" type="file" accept="image/*" onchange="uploadPhoto(event)"><button class="btn alt" onclick="removePhoto()">写真を削除</button><hr><label>お名前</label><input class="field" id="childNameEdit" value="${escapeHtml(c.name)}"><label>生年月日</label><input class="field" id="childDobEdit" type="date" value="${escapeHtml(c.dob)}"><button class="btn" onclick="saveChildSettings()">プロフィールを保存</button><hr><button class="btn alt" onclick="showFamily()">家族共有・バックアップ</button>`)}async function saveChildSettings(){let c=child();c.name=$('#childNameEdit').value.trim()||c.name;c.dob=$('#childDobEdit').value;if(!await saveAll())return;closeModal();render()}async function uploadPhoto(e){let file=e.target.files?.[0];if(!file)return;if(file.size>12e6)return alert('12MB以下の写真を選んでください');let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{let canvas=document.createElement('canvas'),w=900,h=Math.round(im.height*900/im.width);canvas.width=w;canvas.height=Math.min(h,1500);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);let c=child();c.photo=canvas.toDataURL('image/jpeg',.72);persistPhoto();URL.revokeObjectURL(url);closeModal();render()};im.src=url}function persistPhoto(){try{localStorage.setItem('kodomo-v09-photos',JSON.stringify(Object.fromEntries(data.children.filter(c=>c.photo).map(c=>[c.id,c.photo]))))}catch{alert('写真の保存容量を超えました。別の写真を選んでください')}}function loadPhotos(){try{let p=JSON.parse(localStorage.getItem('kodomo-v09-photos')||'{}');data.children.forEach(c=>c.photo=p[c.id]||c.photo||'')}catch{}}async function removePhoto(){child().photo='';persistPhoto();closeModal();render()}

function openCalendar(){modal('予約カレンダー',`<div class="row"><button class="btn alt" onclick="shiftMonth(-1)">‹</button><b>${year}年${month+1}月</b><button class="btn alt" onclick="shiftMonth(1)">›</button></div><div class="calendar" style="margin-top:12px">${['日','月','火','水','木','金','土'].map(d=>`<div class="small" style="text-align:center">${d}</div>`).join('')}${Array.from({length:new Date(year,month,1).getDay()},()=>'<div></div>').join('')}${Array.from({length:new Date(year,month+1,0).getDate()},(_,i)=>{let d=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,rr=records().filter(r=>r.date===d);return `<button class="day ${rr.length?'has':''}" onclick="showDay('${d}')">${i+1}<br>${rr.map(r=>`<i class="dot" style="background:${({done:'#149966',reserved:'#237bea',pending:'#e7971b'})[r.status]}"></i>`).join('')}</button>`}).join('')}</div><p class="small">🟢 接種済み　🔵 予約済み　🟠 未予約（目安日あり）</p><p class="small">未予約で日付未設定のものは一覧で確認できます。</p>`)}function shiftMonth(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}openCalendar()}function showDay(d){let rr=records().filter(r=>r.date===d);modal(displayDate(d),rr.map(r=>`<div class="item"><b>${escapeHtml(childName(r.child_id))} ・ ${escapeHtml(r.vaccine)}</b><div class="small">${labelStatus(r.status)} ・ ${escapeHtml(r.clinic||'')}</div><button class="btn alt" onclick="editRecord('${r.id}')">編集</button></div>`).join('')||'<div class="empty">予定なし</div>');}

function download(name,contents,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function backup(){download('kodomo-care-backup.json',JSON.stringify({children:data.children.map(({photo,...c})=>c),records:data.records},null,2),'application/json')}function exportCsv(){let rows=[['子ども','ワクチン','状態','日付','病院','メモ'],...data.records.map(r=>[childName(r.child_id),r.vaccine,labelStatus(r.status),r.date,r.clinic,r.memo])];download('vaccination-records.csv','\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}async function restore(e){let f=e.target.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.children)||!Array.isArray(d.records))throw Error('ファイル形式が違います');if(!confirm('現在の記録を上書きしますか？'))return;data.children=d.children.map(c=>({...c,photo:''}));data.records=d.records;if(!await saveAll())return;current='home';closeModal();render()}catch(err){alert('読み込みに失敗しました: '+err.message)}}

function showFamily(){modal('家族共有・バックアップ',`<div class="note">家族だけで情報を共有できます。招待コードは信頼できる相手にだけ渡してください。</div><p><b>現在の状態：</b>${mode==='cloud'?'☁ クラウド同期':session?'ログイン済み・家族未参加':'📱 この端末のみ'}</p>${session?`${mode==='cloud'?'<button class="btn alt" onclick="makeInvite()">家族の招待コードを発行</button>':'<button class="btn" onclick="createMyFamily()">新しい家族を作成</button>'}<button class="btn alt" onclick="joinPrompt()">招待コードで家族に参加</button><button class="btn alt" onclick="signOut()">ログアウト</button>`:'<button class="btn" onclick="openLogin()">クラウド接続・ログイン</button>'}<hr><button class="btn alt" onclick="backup()">バックアップを書き出す</button><label>バックアップを読み込む（上書き）</label><input type="file" accept=".json,application/json" class="field" onchange="restore(event)"><button class="btn alt" onclick="exportCsv()">接種記録CSVを保存</button><p class="small">CSVは表計算ソフトで開けます。</p>`)}

function openLogin(){if(!cfg.url||!cfg.anonKey)return modal('クラウド設定が必要',`<p>まず同梱の <b>SETUP.md</b> に従ってSupabaseを設定し、<b>config.js</b> にURLと公開用キーを入力してください。</p><p class="note">秘密鍵・service_roleキーは絶対にアプリに入れないでください。</p>`);modal('家族共有にログイン',`<form onsubmit="login(event)"><label>メールアドレス</label><input class="field" type="email" name="email" required><label>パスワード（8文字以上）</label><input class="field" type="password" name="password" minlength="8" required><button class="btn" name="action" value="signin">ログイン</button> <button class="btn alt" name="action" value="signup">新規登録</button></form><p class="small">メール認証を有効にしている場合は、登録後に届く確認メールを開いてください。</p><p id="loginError" class="error"></p>`)}async function login(e){e.preventDefault();let f=new FormData(e.target),action=e.submitter?.value||'signin',args={email:f.get('email'),password:f.get('password')};let res=action==='signup'?await client.auth.signUp(args):await client.auth.signInWithPassword(args);if(res.error)return $('#loginError').textContent=res.error.message;if(action==='signup'&&!res.data.session)return $('#loginError').textContent='確認メールを開いてからログインしてください。';session=res.data.session;await loadReminderPrefs();await initCloud();closeModal();render()}

async function initCloud(){

 if(!session)return;

 let {data:members,error}=await client.from('family_members').select('family_id,role').eq('user_id',session.user.id).limit(1);

 if(error){alert('クラウド接続エラー: '+error.message);return}

 if(cloudChannel){await client.removeChannel(cloudChannel);cloudChannel=null}

 if(!members?.length){mode='local';data.family_id=null;cloudVersion=null;render();return}

 data.family_id=members[0].family_id;mode='cloud';await fetchCloud();

 cloudChannel=client.channel('family-'+data.family_id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'family_data',filter:'family_id=eq.'+data.family_id},()=>fetchCloud()).subscribe();render();

}

async function fetchCloud(){

 if(!data.family_id)return;

 let {data:rows,error}=await client.from('family_data').select('payload,version').eq('family_id',data.family_id).limit(1);

 if(error){alert('クラウドの読み込みに失敗: '+error.message);return}

 if(!rows?.length)return;

 let p=rows[0].payload||blank(),family=data.family_id;

 cloudVersion=rows[0].version;

 data={...blank(),...p,family_id:family};loadPhotos();render();

}

async function saveAll(){

 if(mode==='local'){persist();return true}

 if(!session||!data.family_id||cloudVersion===null){alert('クラウドに接続できていません');return false}

 let payload={children:data.children.map(({photo,...c})=>c),records:data.records};

 let {data:newVersion,error}=await client.rpc('update_family_data',{p_family_id:data.family_id,p_payload:payload,p_expected_version:cloudVersion});

 if(error){alert('保存できませんでした。最新データを読み込みます。変更内容は失われる可能性があります。\n'+error.message);await fetchCloud();return false}

 cloudVersion=newVersion;return true;

}

async function createMyFamily(){

 if(!session)return openLogin();

 if(!confirm('新しい家族を作成しますか？ すでに別の家族から招待されている場合は「キャンセル」を押してください。'))return;

 let localCopy=JSON.parse(localStorage.getItem('kodomo-v09')||'{}');

 let {error}=await client.rpc('create_family');if(error)return alert('家族作成に失敗: '+error.message);

 await initCloud();

 if(localCopy.children?.length&&confirm('この端末の既存の記録をクラウドに移しますか？')){

   data.children=localCopy.children.map(({photo,...c})=>({...c,photo:''}));data.records=localCopy.records||[];

   await saveAll();

 }

 closeModal();render();

}

async function makeInvite(){let {data:code,error}=await client.rpc('create_invite');if(error)return alert(error.message);modal('家族の招待コード',`<p>家族のスマホでログインし、「招待コードで家族に参加」から入力してください。</p><p style="overflow-wrap:anywhere;font-weight:bold;color:#168f69">${escapeHtml(code)}</p><button class="btn" onclick="navigator.clipboard?.writeText('${code}')">コードをコピー</button><p class="note">コードは24時間で期限切れになります。信頼できる家族にだけ共有してください。</p>`)}

function joinPrompt(){modal('家族に参加',`<p class="note">招待コードを入力して家族の記録を共有します。</p><form onsubmit="joinFamily(event)"><label>招待コード</label><input class="field" name="code" required maxlength="32" autocomplete="off"><button class="btn">参加する</button></form><p id="joinError" class="error"></p>`)}

async function joinFamily(e){e.preventDefault();let code=new FormData(e.target).get('code').trim();let {error}=await client.rpc('join_family',{invite_code:code});if(error)return $('#joinError').textContent=error.message;await initCloud();closeModal();render()}

async function signOut(){if(cloudChannel){await client.removeChannel(cloudChannel);cloudChannel=null}let {error}=await client.auth.signOut();if(error){alert('ログアウトできませんでした: '+error.message);return}session=null;mode='local';cloudVersion=null;data=blank();current='home';closeModal();render()}

async function boot(){if(cfg.url&&cfg.anonKey){data=blank()}else{loadPhotos()}render();if(cfg.url&&cfg.anonKey&&window.supabase){client=window.supabase.createClient(cfg.url,cfg.anonKey);let {data:auth}=await client.auth.getSession();if(auth.session){session=auth.session;await loadReminderPrefs();await initCloud()}client.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'){session=null;mode='local';cloudVersion=null;data=blank();current='home';closeModal();render()}})}}boot();


if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=2026.10.26.1',{scope:'./',updateViaCache:'none'}).catch(()=>{}));}
